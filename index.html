
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор заказа</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Калькулятор стоимости заказа</h1>

    <label for="product">Выберите товар:</label>
    <select id="product">
        <option value="100">Товар 1 — 100 руб.</option>
        <option value="200">Товар 2 — 200 руб.</option>
        <option value="300">Товар 3 — 300 руб.</option>
    </select>

    <br><br>

    <label for="quantity">Количество:</label>
    <input type="text" id="quantity" placeholder="Введите количество">

    <br><br>

    <button type="button" id="calculate">Рассчитать</button>

    <p id="result"></p>

</body>
</html>
