
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор заказа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Калькулятор заказа</h1>
        <p>Рассчитайте стоимость выбранных товаров</p>

        <div class="form">
            <label>Выберите товар:</label>
            <select id="product">
                <option value="100">Ручка — 100 руб.</option>
                <option value="250">Тетрадь — 250 руб.</option>
                <option value="500">Книга — 500 руб.</option>
                <option value="150">Карандаш — 150 руб.</option>
            </select>

            <label>Количество товара:</label>
            <input type="number" id="quantity" placeholder="Введите количество" min="1">

            <button onclick="calculate()">Рассчитать стоимость</button>
        </div>

        <div class="result" id="result">
            Стоимость заказа появится здесь
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
